<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해동성국 키우기 - 발해 건설단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#12263A; --teal:#2F6F6B; --teal-d:#245A57; --seal:#C23B3B; --gold:#E3B341;
  --bg:#E9EFEE; --panel:#F8FAF9; --line:#C5D2D0; --text:#14202B; --muted:#55676A;
  --font-title:"Black Han Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --font-body:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1A24; --panel:#17283A; --line:#2B4257; --text:#E6EEF0; --muted:#9FB3B8; }
}
:root[data-theme="dark"]{ --bg:#0E1A24; --panel:#17283A; --line:#2B4257; --text:#E6EEF0; --muted:#9FB3B8; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:17px; line-height:1.55; }
button{ font-family:inherit; font-size:inherit; color:inherit; cursor:pointer; }
button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
button:disabled{ cursor:not-allowed; }
#app{ max-width:760px; margin:0 auto; padding-bottom:40px; }

/* header */
.hdr{ background:var(--sea); color:#EAF2F1; padding:12px 14px 12px; position:sticky; top:env(safe-area-inset-top,0px); z-index:20; }
.hrow{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.game{ font-family:var(--font-title); font-size:24px; line-height:1.1; }
.grade{ font-size:14px; opacity:.8; }
.gear{ background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-radius:10px; width:42px; height:42px; font-size:20px; }
.res{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
.rc{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:10px; padding:5px 8px; line-height:1.2; }
.rc span{ font-size:15px; }
.rc b{ display:block; font-size:19px; }
.rc small{ font-size:12px; opacity:.75; }

.tabs{ display:grid; grid-template-columns:repeat(5,1fr); background:var(--panel); border-bottom:2px solid var(--line); position:sticky; top:calc(env(safe-area-inset-top,0px) + 106px); z-index:19; }
.tab{ border:none; background:transparent; padding:9px 2px 7px; font-size:14px; position:relative; border-bottom:4px solid transparent; }
.tab i{ display:block; font-style:normal; font-size:21px; line-height:1.2; }
.tab.on{ border-bottom-color:var(--seal); font-weight:700; }
.badge{ position:absolute; top:3px; right:calc(50% - 26px); background:var(--seal); color:#fff; border-radius:10px; font-size:12px; min-width:19px; padding:0 5px; line-height:19px; }
@media (max-width:420px){ .game{ font-size:20px; } .tabs{ top:calc(env(safe-area-inset-top,0px) + 104px); } }

#view{ padding:14px; }
.h2{ font-family:var(--font-title); font-weight:400; font-size:22px; margin:0 0 4px; }
.sub{ color:var(--muted); font-size:15px; margin:0 0 10px; }

/* map */
.pills{ display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px; }
.pill{ white-space:nowrap; border:2px solid var(--line); background:var(--panel); border-radius:20px; padding:5px 12px; font-size:15px; }
.pill.on{ background:var(--sea); color:#fff; border-color:var(--sea); }
.pill:disabled{ opacity:.5; }
.mapgrid{ display:grid; grid-template-columns:repeat(var(--cols),1fr); gap:6px; padding:10px; border-radius:14px; margin-bottom:12px; }
.mapgrid.m0{ background:linear-gradient(160deg,#6E8B5A,#4B6841); }
.mapgrid.m1{ background:linear-gradient(160deg,#9CB872,#6F9157); }
.mapgrid.m2{ background:linear-gradient(160deg,#8A979A,#5C6A6D); outline:4px solid var(--gold); outline-offset:-4px; }
.mapgrid.m3{ background:linear-gradient(160deg,#2F6F6B,#173E3C); outline:4px solid var(--gold); outline-offset:-4px; }
.plot{ aspect-ratio:1; border-radius:10px; border:2px dashed rgba(255,255,255,.4); background:rgba(0,0,0,.14); color:rgba(255,255,255,.8); display:grid; place-items:center; position:relative; padding:0; font-size:22px; overflow:hidden; }
.plot.has{ border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.18); }
.plot.ready:hover{ background:rgba(255,255,255,.28); }
.plot svg{ width:88%; height:88%; }
.plot .emo{ font-size:clamp(24px,7vw,38px); }
.plot em{ position:absolute; bottom:1px; left:0; right:0; text-align:center; font-style:normal; font-size:11px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7); }

.pal{ display:grid; gap:8px; }
.bc{ display:grid; grid-template-columns:50px 1fr; gap:10px; align-items:center; text-align:left; padding:8px 10px; border:2px solid var(--line); border-radius:12px; background:var(--panel); }
.bc.sel{ border-color:var(--seal); background:rgba(194,59,59,.08); }
.bc.lock{ opacity:.45; }
.bc .ic{ width:50px; height:46px; display:grid; place-items:center; font-size:30px; }
.bc .ic svg{ width:100%; height:100%; }
.bc b{ font-size:17px; }
.bc span{ display:block; font-size:14px; color:var(--muted); line-height:1.35; }
.cost{ font-size:14px; color:var(--text); }
.cost.no{ color:var(--seal); font-weight:700; }

/* tasks */
.task{ display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
.task .ti{ font-size:30px; text-align:center; }
.task b{ display:block; }
.task span{ font-size:14px; color:var(--muted); }
.go{ background:var(--teal); color:#fff; border:none; border-radius:10px; padding:9px 14px; font-weight:700; }
.empty{ text-align:center; color:var(--muted); padding:26px 8px; border:2px dashed var(--line); border-radius:12px; }

/* notes */
.ng{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.nt{ text-align:left; padding:10px; border:2px solid var(--line); border-radius:12px; background:var(--panel); min-height:62px; }
.nt.lk{ opacity:.5; border-style:dashed; }
.nt b{ display:block; font-size:16px; }
.nt span{ font-size:13px; color:var(--muted); }
.bar{ height:12px; background:var(--line); border-radius:6px; overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--seal); }
.req{ margin:10px 0; }
.req div.l{ display:flex; justify-content:space-between; font-size:15px; margin-bottom:3px; }
.req.ok .l b{ color:var(--teal); }
.stat{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0; }
.stat div{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; }
.stat b{ display:block; font-size:20px; }
.stat small{ color:var(--muted); }

/* modal */
#modal{ position:fixed; inset:0; background:rgba(8,16,24,.68); display:none; align-items:center; justify-content:center; padding:14px; z-index:50; }
#modal.open{ display:flex; }
.sheet{ width:100%; max-width:560px; max-height:calc(100vh - 28px); overflow:auto; background:var(--panel); border-radius:16px; padding:20px; border-top:8px solid var(--teal); }
.sheet h3{ font-family:var(--font-title); font-weight:400; font-size:25px; margin:0 0 6px; line-height:1.25; }
.sheet p{ margin:8px 0; }
.head{ font-size:14px; color:var(--teal); font-weight:700; margin-bottom:4px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.btn{ flex:1; min-width:120px; padding:12px 14px; border-radius:12px; border:2px solid var(--teal); background:var(--teal); color:#fff; font-size:17px; font-weight:700; }
.btn.alt{ background:transparent; color:var(--text); border-color:var(--line); }
.btn.seal{ background:var(--seal); border-color:var(--seal); }
.btn.gold{ background:var(--gold); border-color:var(--gold); color:#2a2000; }
.btn:disabled{ opacity:.45; }
.opts{ display:grid; gap:8px; margin-top:12px; }
.opt{ padding:12px 14px; border:2px solid var(--line); border-radius:12px; background:var(--bg); text-align:left; font-size:17px; line-height:1.4; }
.opt:hover{ border-color:var(--teal); }
.q{ font-size:19px; line-height:1.5; margin:6px 0; }
.good{ border-left:6px solid var(--teal); background:rgba(47,111,107,.14); padding:10px 12px; border-radius:8px; margin:10px 0; }
.bad{ border-left:6px solid var(--seal); background:rgba(194,59,59,.1); padding:10px 12px; border-radius:8px; margin:10px 0; }
.pic{ display:block; max-width:100%; max-height:200px; margin:8px auto; border-radius:10px; object-fit:contain; }
.bigemo{ font-size:56px; text-align:center; line-height:1.2; }
.learn{ background:var(--bg); border-radius:12px; padding:12px; margin:10px 0; }

/* dig */
.dig-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:15px; flex-wrap:wrap; }
.dgrid{ display:grid; grid-template-columns:repeat(var(--w),minmax(0,1fr)); gap:3px; padding:6px; background:#4A3624; border-radius:10px; margin:10px 0; }
.dc{ aspect-ratio:1; border:none; border-radius:5px; background:#8B6B4C; background-image:radial-gradient(rgba(0,0,0,.18) 1.4px,transparent 1.5px); background-size:8px 8px; display:grid; place-items:center; font-size:clamp(14px,4.4vw,22px); font-weight:700; color:#fff; padding:0; }
.dc:hover:not(:disabled){ filter:brightness(1.18); }
.dc.rv{ background:#3B2D20; }
.dc.n1{ color:#8EC9FF; } .dc.n2{ color:#8CE0A0; } .dc.n3{ color:#FFB38A; } .dc.n4,.dc.n5,.dc.n6,.dc.n7,.dc.n8{ color:#FF8A8A; }
.dc.it{ background:var(--gold); }
.dc .pic{ margin:0; max-height:100%; width:100%; border-radius:4px; }
.catg{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.catg .opt{ text-align:center; padding:10px 6px; font-size:16px; }
.fl{ background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:6px 12px; font-size:15px; }
.fl.on{ background:var(--seal); color:#fff; border-color:var(--seal); }
.found-list{ list-style:none; margin:8px 0; padding:0; }
.found-list li{ display:flex; gap:10px; padding:6px 0; border-top:1px dashed var(--line); align-items:center; }
.seal-stamp{ display:inline-block; font-family:var(--font-title); color:var(--seal); border:5px solid var(--seal); border-radius:10px; padding:4px 16px; font-size:40px; transform:rotate(-5deg); margin:6px 0 10px; letter-spacing:4px; }
#toast{ position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--sea); color:#fff; padding:10px 18px; border-radius:24px; font-size:16px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:80; max-width:92%; text-align:center; }
#toast.show{ opacity:1; }
@media (prefers-reduced-motion:reduce){ #toast{ transition:none; } }

.plot img.thumb,.bc .ic img.thumb{width:94%;height:94%;object-fit:contain;border-radius:6px;background:#fff}
.hbtns{display:flex;gap:6px}
.dc.rv{font-size:clamp(9px,2.6vw,12px);font-weight:700;line-height:1.1}
.dc.hot{background:#E2553C;color:#fff}.dc.warm{background:#F2A93B;color:#3a2400}
.dc.cool{background:#8EC3E6;color:#0d2b3b}.dc.ice{background:#2F5F9E;color:#fff}
.dc.rv.it{font-size:clamp(16px,5vw,26px);background:var(--gold)}
.lgd{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;margin:8px 0}
.lgd span{padding:3px 9px;border-radius:10px}
.catg .opt:last-child{grid-column:1/-1}
.tagy{color:#E3B341;font-size:14px;font-weight:700}
.seal-stamp.gray{color:#9aa7b0;border-color:#9aa7b0}
.sheet.end{background:#18222D;color:#EAF2F1;border-top-color:#8A2A2A}
.sheet.end .opt{background:#243242;color:#EAF2F1;border-color:#3A4F63}
.sheet.end .learn{background:#22303F}
.sheet.end .head{color:#E3B341}
.sheet.end .btn.alt{color:#EAF2F1;border-color:#3A4F63}
.sheet.end .good{background:rgba(47,111,107,.3)}
.sheet.end .bad{background:rgba(194,59,59,.25)}

.scene{position:fixed;inset:0;z-index:60;background:#0c1620;color:#EAF2F1;display:none;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scene.open{display:block}
.sc-in{max-width:900px;margin:0 auto;padding:14px}
.sc-h{font-family:var(--font-title);font-weight:400;font-size:26px;margin:2px 0 8px;line-height:1.25}
.scene .learn{background:#1a2a3a}
.scene .good{background:rgba(47,111,107,.35)}
.scene .bad{background:rgba(194,59,59,.28)}
.scene .btn.alt{color:#EAF2F1;border-color:#3A4F63}
.bt-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mini2{background:#243242;color:#fff;border:1px solid #3A4F63;border-radius:8px;padding:4px 12px;font-weight:700}
.btcap{min-height:44px;background:rgba(227,179,65,.14);border-left:4px solid var(--gold);border-radius:6px;padding:6px 10px;margin-bottom:6px;font-size:15px;line-height:1.4;transition:opacity .3s}
.bcv{display:block;width:100%;border-radius:12px;background:#222;touch-action:manipulation;margin:0 auto}
.mrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px}
.bar2{flex:1;height:12px;background:#243242;border-radius:6px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--gold);width:0}
.ubar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ubtn{position:relative;overflow:hidden;border:2px solid #3A4F63;background:#1c2b3a;color:#fff;border-radius:10px;padding:6px 2px;text-align:center;line-height:1.25}
.ubtn b{display:block;font-size:24px;font-weight:400}
.ubtn small{display:block;font-size:12px}
.ubtn .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.55);pointer-events:none}
.ubtn:disabled{opacity:.55}
.ubtn:not(:disabled){border-color:var(--gold)}
.ult{width:100%;margin-top:8px}
/* 외교 */
.route{position:relative;height:74px;background:linear-gradient(#2c6b8f,#1b3a5c);border-radius:12px;overflow:hidden;margin:10px 0}
.ship{position:absolute;top:16px;font-size:38px;animation:sail 3.4s linear infinite}
.route.rev .ship{animation-name:sailr}
@keyframes sail{from{left:-12%}to{left:100%}}
@keyframes sailr{from{left:100%}to{left:-12%}}
@media (prefers-reduced-motion:reduce){.ship{animation:none;left:45%}}
.fact{background:#1a2a3a;border-radius:10px;padding:10px 12px}
.dstage{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0}
.av{width:104px;text-align:center}
.av svg{width:100%;height:auto;display:block}
.nm{font-size:14px;color:#cfe0e4}
.vs{font-size:26px;opacity:.6;padding-bottom:30px}
.bubble{position:relative;border-radius:16px;padding:12px 14px;margin:8px 0;max-width:94%;line-height:1.5}
.bubble.npc{background:#fff;color:#14202B;border-top-left-radius:3px}
.bubble.me{background:#2F6F6B;color:#fff;margin-left:auto;border-top-right-radius:3px}
.sub2{color:#9FB3B8;font-size:14px;margin:12px 0 4px}
.obub{display:grid;gap:8px}
.ob{background:#E6F2F0;color:#14202B;border:2px solid #2F6F6B;border-radius:16px;border-top-right-radius:3px;padding:11px 14px;text-align:left;line-height:1.45;font-size:16px}
.ob:hover{background:#fff}
.tabs{grid-template-columns:repeat(6,1fr)!important}
.tab{font-size:13px!important}

.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hdr,.tabs{position:static!important}
.rs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;opacity:.92;margin-top:2px}
.rs b{font-weight:700}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.histbox{border:3px solid var(--gold);border-radius:14px;padding:14px;margin:14px 0;background:linear-gradient(135deg,rgba(227,179,65,.18),rgba(194,59,59,.12));animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 18px rgba(227,179,65,.55)}}
@media (prefers-reduced-motion:reduce){.histbox{animation:none}}
.hist-h{font-family:var(--font-title);font-size:20px;color:var(--gold);margin-bottom:4px}
.hist-big{font-family:var(--font-title);font-size:26px;line-height:1.3;margin:4px 0 8px}
.hist-cmp{margin-top:8px;font-weight:700}
.chron{margin:6px 0 0;padding-left:20px;font-size:15px;line-height:1.5;max-height:240px;overflow:auto}
.sheet.end .stack{background:#2a3a4a}

/* 발굴 칸: 세로로 긴 사진(석등·영광탑 등)이 칸을 늘리지 않도록 고정 */
.dc{position:relative;overflow:hidden;min-width:0;min-height:0}
.dc .pic{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;object-fit:contain;background:#fff;border-radius:4px}
.plot{min-width:0;min-height:0}
.plot img.thumb{position:absolute;inset:3%;width:94%;height:94%;max-height:none}

.res{grid-template-columns:repeat(3,1fr)!important;gap:5px!important}
@media (min-width:640px){.res{grid-template-columns:repeat(6,1fr)!important}}
.rc{display:flex!important;align-items:baseline;gap:4px;padding:4px 8px!important;line-height:1.2}
.rc span{font-size:14px}
.rc b{display:inline!important;font-size:17px}
.rc small{font-size:11px;opacity:.75;margin-left:auto}
.rc.neg small{color:#ffb4a8;opacity:1}
.rc.lowm{border-color:#ff8a7a}
.tbtns{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.tbtns .x{background:transparent;border:1px solid var(--line);border-radius:8px;font-size:12px;padding:2px 8px;color:var(--muted)}
.badge.bang{background:var(--gold);color:#2a2000}
.stackbox{position:relative;margin:8px auto;background:linear-gradient(#cfe3ee,#e8f0e0);border-radius:10px;border-bottom:6px solid #6b5a3a;overflow:hidden;touch-action:manipulation}
.stl{position:absolute;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.stl.cur{background:#E3B341}
.tapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.tc{aspect-ratio:1;border-radius:14px;border:2px solid #3A4F63;background:#1c2b3a;font-size:34px;color:#fff;padding:0;touch-action:manipulation}
.mgslots{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:10px 0}
.mgslot{background:#1a2a3a;border:2px dashed #3A4F63;border-radius:12px;padding:6px;min-height:110px}
.mgl{font-size:14px;margin-bottom:4px;text-align:center}
.mgc{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:50px}
.mgtray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;background:#142230;border-radius:12px;min-height:64px}
.mgi{width:52px;height:52px;display:grid;place-items:center;font-size:30px;background:#243242;border:2px solid #3A4F63;border-radius:10px;touch-action:none;user-select:none;cursor:grab}
.mgi.placed{border-color:var(--gold);cursor:default;width:44px;height:44px;font-size:26px}
.mgi.drag{opacity:.9;box-shadow:0 6px 14px rgba(0,0,0,.5)}

.alertbar{background:linear-gradient(90deg,#8e1b1b,#c23b3b,#8e1b1b);color:#fff;text-align:center;font-family:var(--font-title);font-size:20px;padding:8px;border-radius:10px;margin:0 0 10px;animation:siren 0.9s ease-in-out infinite}
@keyframes siren{50%{filter:brightness(1.5)}}
@media (prefers-reduced-motion:reduce){.alertbar{animation:none}}

.mashbtn{display:block;width:min(260px,80%);aspect-ratio:1;margin:14px auto;border-radius:50%;border:6px solid var(--gold);background:radial-gradient(circle at 35% 30%,#ffb08a,#C23B3B);font-size:84px;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mashbtn:active{transform:scale(.92)}
.tbar{position:relative;height:54px;background:#243242;border-radius:27px;margin:14px 0;border:3px solid #3A4F63;overflow:hidden}
.tzone{position:absolute;top:0;bottom:0;background:rgba(80,200,120,.55);border-left:3px solid #4FD18A;border-right:3px solid #4FD18A}
.tmark{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:34px;line-height:1;left:0}
.cnbox{position:relative;display:flex;justify-content:space-between;gap:10px;padding:10px 4px;touch-action:none;user-select:none;-webkit-user-select:none}
.cnsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.cncol{display:flex;flex-direction:column;gap:12px;z-index:1;width:42%}
.cn{padding:12px 8px;border-radius:12px;background:#1c2b3a;border:3px solid #3A4F63;text-align:center;font-size:17px;line-height:1.25}
.cnl{cursor:grab}
.cn.done{opacity:.6}

.plot.cons{background:repeating-linear-gradient(45deg,rgba(227,179,65,.35) 0 8px,rgba(0,0,0,.25) 8px 16px);border:2px dashed var(--gold);color:#fff}
.plot.cons .cs{font-size:clamp(22px,6vw,32px)}
.plot.cons em{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-style:normal;font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.bc small{color:var(--muted);font-size:13px}
.quote{border-left:6px solid var(--gold);background:rgba(227,179,65,.15);padding:12px 14px;border-radius:8px;margin:10px 0;line-height:1.7;font-size:16.5px}
.sheet.end .quote{background:rgba(227,179,65,.12)}
.cine{position:fixed;inset:0;background:#000;display:none;z-index:70;opacity:1;transition:opacity .45s;overflow:auto}
.cine.open{display:block}.cine.fadeout{opacity:0}
.cine-in{max-width:820px;margin:0 auto;min-height:100%;padding:70px 24px 110px;display:flex;flex-direction:column;justify-content:center}
#cine-text p{margin:0 0 22px;font-size:clamp(19px,4.6vw,28px);line-height:1.9;color:#EDE6D3;word-break:keep-all}
#cine-text p.src{font-size:clamp(14px,3.4vw,19px);color:#9a9486;text-align:right}
#cine-text p.typing::after{content:'▌';color:#E3B341;animation:cur .8s steps(1) infinite;margin-left:2px}
.cine .gold{color:#E3B341;font-weight:700}
.cine-title{font-family:var(--font-title);font-size:clamp(54px,16vw,120px);text-align:center;color:#E3B341;opacity:0;transition:opacity 1.4s;letter-spacing:.14em;margin-top:26px;text-shadow:0 0 28px rgba(227,179,65,.55)}
.cine-title.show{opacity:1}
.cine-tap{position:fixed;left:0;right:0;bottom:30px;text-align:center;color:#a9a393;font-size:18px;opacity:0;animation:blink 1.4s ease-in-out infinite;pointer-events:none}
.cine-skip{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:transparent;border:1px solid #555;color:#aaa;border-radius:18px;padding:6px 14px;font-size:14px;z-index:2}
@keyframes cur{50%{opacity:0}}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#cine-text p.typing::after,.cine-tap{animation:none}.cine-title{transition:none}}
.bc.ok{border-color:var(--teal);background:rgba(47,111,107,.1)}
h4.grp{margin:14px 0 6px;font-size:16px;color:var(--muted)}h4.grp.g0{color:var(--teal)}
.kings{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin-bottom:6px}
.kingcard{position:relative;border:2px solid var(--kc);border-radius:12px;padding:10px 10px 9px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.kingcard.now{background:linear-gradient(135deg,rgba(255,255,255,0),var(--kc));box-shadow:0 0 0 3px var(--kc)}
.kingcard.now .kname,.kingcard.now .kyears,.kingcard.now .kline{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.kingcard.unk{opacity:.55;border-style:dashed}
.kname{font-family:var(--font-title);font-weight:400;font-size:24px;line-height:1.15;color:var(--kc)}
.kyears{font-size:13px;color:var(--muted)}.kline{font-size:13px;line-height:1.35}
.kn{position:absolute;top:-10px;right:8px;background:var(--seal);color:#fff;font-size:12px;border-radius:10px;padding:1px 8px}
.kingbanner{border-left:8px solid var(--kc);background:rgba(227,179,65,.14);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:18px}
.kingbanner b{font-family:var(--font-title);font-weight:400;font-size:26px;color:var(--kc)}
.kingbanner span{font-size:14px;color:var(--muted)}
.kingchip{display:inline-block;background:var(--kc);color:#fff;border-radius:16px;padding:3px 14px;font-family:var(--font-title);font-size:20px;margin:2px 0 6px}
.kingchip small{font-family:var(--font-body);font-size:12px;opacity:.9}
</style>
</head>

<div id="app">
  <div class="stick"><header class="hdr">

    </div>
    <div class="res" id="res"></div>
  </header>
  <nav class="tabs" id="tabs"></nav></div>
  <main id="view"></main>
</div>

function costHtml(c){

function setMap(i){ if(i<=S.stage){ S.curMap=i; render(); } }
function selB(id){ S.sel = (S.sel===id)?null:id; render(); }

function rewardText(r){
  if(!r) return '';
  const a=[]; if(r.p) a.push('⭐'+r.p); if(r.f) a.push('🌾'+r.f); if(r.t) a.push('🧱'+r.t); if(r.people) a.push('👥'+r.people);
  if(r.g) a.push('💰'+r.g); if(r.m) a.push('💗'+r.m); if(r.mil) a.push('⚔️'+r.mil); if(r.dip) a.push('🤝'+r.dip);
  return a.join(' ');
}
function giveReward(r){
  if(!r) return;
  S.f+=r.f||0; S.t+=r.t||0; S.people+=r.people||0; S.power+=r.p||0; S.gold=(S.gold||0)+(r.g||0);
  if(r.m){ S.morale=Math.max(0,Math.min(100,S.morale+r.m)); }
  if(r.mil) addStat('mil',r.mil); if(r.dip) addStat('dip',r.dip);
}

function fmtTime(s){ s=Math.max(0,Math.ceil(s)); return s<60 ? s+'초' : (Math.floor(s/60)+'분'+(s%60?' '+(s%60)+'초':'')); }
function bEmo(b){ return b.icon || ({thatch:'🛖',gi:'🏠',gate:'🚪'}[b.id]||'🏗️'); }
function unlockHtml(stage,lead){
  const nb=BLIST.filter(b=>b.stage===stage); if(!nb.length) return '';
  return `<div class="learn"><b>🏗️ ${lead||'이제'} 이런 건물을 지을 수 있어요!</b><p>${nb.map(b=>`${bEmo(b)} ${b.name}`).join(' · ')}</p></div>`;
}
function placeAt(i){
  const m=S.curMap, cur=S.maps[m][i], key=m+':'+i;
  if(cur){ showBInfo(cur,i); return; }
  if(S.cons[key]){ showConsInfo(key); return; }
  if(!S.sel){ toast('먼저 지을 건물을 골라요'); return; }
  const b=B[S.sel];
  if(!canPay(b.cost)){ toast('자원이 부족해요. 할 일을 하면 자원이 생겨요'); return; }
  payCost(b.cost);
  S.cons[key]={id:b.id,left:b.time,total:b.time};
  sfx('build'); toast(`🚧 ${b.name} 공사 시작! (${fmtTime(b.time)})`);
  save();
  if(b.q && !S.bl[b.id]){ S.bl[b.id]=true; showLearn(b); } else render();
}
function finishBuild(key){
  const c=S.cons[key]; if(!c) return;
  const [m,i]=key.split(':').map(Number), b=B[c.id];
  delete S.cons[key]; S.maps[m][i]=b.id;
  if(b.mood) S.morale=Math.min(100,S.morale+b.mood);
  if(b.build){ S.people+=b.build.people||0; S.power+=b.build.p||0; addStat('mil',b.build.mil||0); addStat('dip',b.build.dip||0); }
  const k=S.tasks.findIndex(t=>t.type==='build' && t.bid===b.id);
  sfx('good');
  if(k>=0){ const t=S.tasks[k]; giveReward(t.reward); S.tasks.splice(k,1); toast(`🏗️ ${b.name} 완공! 건설 의뢰 완료 ${rewardText(t.reward)}`); }
  else toast(`🏗️ ${b.name} 완공! ${b.build&&b.build.p?'⭐+'+b.build.p:''}`);
}
function tickBuild(){
  let fin=false;
  Object.keys(S.cons).forEach(k=>{ const c=S.cons[k]; c.left-=1; if(c.left<=0){ finishBuild(k); fin=true; } });
  if(!fin) updCons();
  return fin;
}
function updCons(){
  if(S.tab!=='build') return;
  Object.keys(S.cons).forEach(k=>{ const el=$('cd_'+k); if(el) el.textContent=fmtTime(S.cons[k].left); });
}
function showConsInfo(key){

  openModal(`<h3>🚧 ${b.name} 공사 중</h3><div style="width:90px;margin:4px auto">${bIcon(b.id)}</div>

  <div class="row"><button class="btn gold" ${S.gold>=cost?'':'disabled'} onclick="rushBuild('${key}')">⏩ 서두르기 (💰${cost})</button><button class="btn alt" onclick="closeModal()">닫기</button></div>`);
}
function rushBuild(key){
  const c=S.cons[key]; if(!c) return; const cost=Math.ceil(c.left/4);
  if(S.gold<cost){ toast('국고가 부족해요'); return; }
  S.gold-=cost; closeModal(); finishBuild(key); save(); render();
}
function showBInfo(id,idx){
  const b=B[id], n=b.note?NOTES[b.note]:null;
  openModal(`<h3>${b.name}</h3><div style="width:90px;margin:4px auto">${bIcon(id)}</div><p>${b.desc}</p>

  <div class="row"><button class="btn" onclick="closeModal()">닫기</button>${MAINT[id]?`<button class="btn gold" onclick="startMaintManual('${id}')">🛠️ 관리하기</button>`:''}${idx!==undefined?`<button class="btn alt" onclick="confirmDemolish(${idx})">🧹 철거</button>`:''}</div>`);
}
function confirmDemolish(i){
  const id=S.maps[S.curMap][i]; if(!id) return; const b=B[id];
  openModal(`<h3>🧹 ${b.name} 철거</h3><p>정말 철거할까요?</p>
  <div class="bad"><b>건설 비용의 절반을 돌려받아요.</b><br>대신 이 건물이 준 국력·백성·군사력·외교력도 함께 줄고, 💗 민심이 조금 떨어져요.</div>
  <div class="row"><button class="btn seal" onclick="demolish(${i})">철거하기</button><button class="btn alt" onclick="closeModal()">취소</button></div>`);
}
function demolish(i){
  const m=S.curMap, id=S.maps[m][i]; if(!id) return; const b=B[id], c=b.cost||{};
  S.maps[m][i]=null;
  S.f+=Math.floor((c.f||0)/2); S.t+=Math.floor((c.t||0)/2); S.gold+=Math.floor((c.g||0)/2);
  if(b.build){
    S.people=Math.max(1,S.people-(b.build.people||0));
    S.power=Math.max((S.mil||0)+(S.dip||0), S.power-(b.build.p||0));
    addStat('mil',-(b.build.mil||0)); addStat('dip',-(b.build.dip||0));
  }
  S.morale=Math.max(0,S.morale-2-(b.mood||0));
  chron(`🧹 ${b.name}을(를) 철거했어요.`); sfx('bad'); save(); closeModal(); toast(`🧹 ${b.name} 철거 완료`);
}
function startMaintManual(id){
  const cd=(S.mcd||{})[id]||0, left=Math.ceil(cd-(S.play||0));
  if(left>0){ toast(`잠시 뒤에 다시 할 수 있어요 (${left}초)`); return; }
  S.mcd[id]=(S.play||0)+90; runMaint(id,()=>closeModal(),true);
}

function openModal(html,cls){ const sh=$('sheet'); sh.className='sheet '+(cls===undefined?MCLS:cls); sh.innerHTML=html; $('modal').classList.add('open'); modalOpen=true; sh.scrollTop=0; sh.focus(); }
function closeModal(){ $('modal').classList.remove('open'); modalOpen=false; Q=null; DG=null; EN=null; MCLS=''; setMood('calm'); save(); render(); }

/* ===== 학습/퀴즈 ===== */
function learn(noteId){ if(noteId && !S.learned[noteId]){ S.learned[noteId]=true; return true; } return false; }
function askQ(qid, o){
  const q=Qid(qid);
  const order = q.type==='ox' ? [0,1] : shuffle(q.opts.map((_,i)=>i));
  Q={q,o,order,ok:false};
  renderQ(null);
}
function renderQ(fb){
  const {q,o,order}=Q;
  let h = `<div class="head">${o.head}</div><div class="q">${q.q}</div>`;
  if(!fb){
    h += `<div class="opts">${order.map((idx,k)=>`<button class="opt" onclick="pickA(${k})">${q.opts[idx]}</button>`).join('')}</div>`;
    if(o.skip) h += `<div class="row"><button class="btn alt" onclick="closeModal()">나중에 하기</button></div>`;
  } else {
    h += `<div class="${fb.ok?'good':'bad'}"><b>${fb.ok?'정답이에요!':'아쉬워요. 정답은 「'+q.opts[q.a]+'」'}</b><br>${q.exp}${fb.rw?`<br><b>${fb.rw}</b>`:''}</div>`;
    if(fb.nw){ const n=NOTES[q.note]; h += `<div class="learn"><b>📖 노트가 열렸어요: ${n.icon} ${n.title}</b></div>`; }
    h += `<div class="row"><button class="btn" onclick="finishQ()">다음</button></div>`;
  }
  openModal(h);
}
function pickA(k){
  const q=Q.q, ok = Q.order[k]===q.a;
  Q.ok=ok; S.st.q++;
  let rw='';
  if(ok){
    S.st.c++; S.streak++; if(S.streak>S.best) S.best=S.streak; S.ans[q.id]='c';
    if(Q.o.reward){ giveReward(Q.o.reward); rw='보상 '+rewardText(Q.o.reward); }
    if(S.streak%3===0 && !Q.o.noStreak){ S.power+=2; rw += (rw?' · ':'')+`🔥 ${S.streak}연속 정답! ⭐+2`; }
    sfx('good');
  } else {
    S.streak=0; if(S.ans[q.id]!=='c') S.ans[q.id]='w';
    const pn=Q.o.penalty; if(pn&&pn.f){ const lost=Math.min(S.f,pn.f); S.f-=lost; if(lost) rw=`전쟁 피해로 🌾 -${lost}`; }
    sfx('bad');
  }
  const nw = learn(q.note);
  save();
  renderHdr();
  renderQ({ok,rw,nw});
}
function finishQ(){ const cb=Q.o.cb, ok=Q.ok; Q=null; cb(ok); }

function pickQs(n, kind, exclude){
  let pool = QS.filter(q=>q.stage<=S.stage && !(exclude||[]).includes(q.id));
  if(kind==='scene') pool = pool.filter(q=>q.type==='scene'); else if(kind==='quiz') pool = pool.filter(q=>q.type!=='scene');
  pool = pool.map(q=>({q, w:(S.ans[q.id]==='c'?1:0)+Math.random()*1.2})).sort((a,b)=>a.w-b.w);
  return pool.slice(0,n).map(x=>x.q);
}

/* ===== 할 일 ===== */
function spawnTask(){
  const has = t => S.tasks.some(x=>x.type===t);
  const r=Math.random(); let type;
  if(r<0.28) type='quiz'; else if(r<0.38) type='scene'; else if(r<0.50) type='build'; else if(r<0.58) type='dig'; else if(r<0.67) type='diplo'; else if(r<0.92) type='maint'; else type='war';
  if(['dig','diplo','war'].includes(type) && has(type)) type='quiz';
  const used = S.tasks.map(t=>t.qid).filter(Boolean);
  const mk = (extra)=>{ const t=Object.assign({id:S.tid++}, extra); S.tasks.push(t); return t; };
  const bonus = () => pick([{f:8},{f:8},{t:4},{g:8}]);
  if(type==='quiz'){ const q=pickQs(8,'quiz',used); if(!q.length) return false; const x=pick(q.slice(0,4)); const b=bonus(); mk({type:'quiz',qid:x.id,reward:Object.assign({p:3},b)}); }
  else if(type==='scene'){ const q=pickQs(8,'scene',used); if(!q.length) return spawnTaskFallback(); const x=pick(q.slice(0,3)); const b=bonus(); mk({type:'scene',qid:x.id,reward:Object.assign({p:4},b)}); }
  else if(type==='build'){
    const reqB=S.tasks.filter(t=>t.type==='build').map(t=>t.bid);
    const opts=BLIST.filter(b=>b.stage<=S.stage && !reqB.includes(b.id));
    if(!opts.length) return false;
    const b=pick(opts); mk({type:'build',bid:b.id,reward:{p:5,f:10,t:4,g:6}});
  }
  else if(type==='maint'){
    const have=S.tasks.filter(t=>t.type==='maint').map(t=>t.bid);
    const o=maintTargets().filter(id=>!have.includes(id));
    if(!o.length) return spawnTaskFallback();
    const mb=pick(o); mk({type:'maint',bid:mb,vi:maintRand(mb),reward:null});
  }
  else if(type==='war'){
    const gun=myStats().gun;
    const o=Object.values(BATTLES).filter(b=>b.kind==='exped' && btUnlocked(b) && gun>=b.need*0.5 && b.id!==S.lastWar);
    if(!o.length) return spawnTaskFallback();
    mk({type:'war',bid:pick(o).id,reward:null});
  }
  else if(type==='diplo'){ const o=Object.values(DIPLO).filter(d=>d.stage<=S.stage); if(!o.length) return spawnTaskFallback(); mk({type:'diplo',did:pick(o).id,reward:null}); }
  else mk({type:'dig',reward:{p:2}});
  return true;
}
function spawnTaskFallback(){ const q=pickQs(8,'quiz',S.tasks.map(t=>t.qid)); if(!q.length) return false; S.tasks.push({id:S.tid++,type:'quiz',qid:pick(q.slice(0,4)).id,reward:{p:3,f:8}}); return true; }

function taskInfo(t){
  if(t.type==='quiz') return {ic:'📜', title:'사관의 질문', desc:'발해에 대한 질문에 답해요', btn:'답하기'};
  if(t.type==='scene'){ const k=Qid(t.qid).kind; return k==='res'?{ic:'🧑',title:'새 주민이 찾아왔어요',desc:'알맞게 맞이해 주세요',btn:'맞이하기'}:k==='env'?{ic:'🚢',title:'사신이 도착했어요',desc:'사신을 맞이해 주세요',btn:'맞이하기'}:{ic:'🔎',title:'학자가 찾아왔어요',desc:'학자의 질문에 답해요',btn:'답하기'}; }
  if(t.type==='maint'){ const m=maintVar(t.bid,t.vi); return {ic:m.icon, title:`건물 관리: ${B[t.bid].name} · ${m.title}`, desc:'터치·타이밍·선 잇기 미니게임', btn:'하러 가기'}; }
  if(t.type==='war'){ const b=BATTLES[t.bid]; return {ic:'⚔️', title:`출정 요청: ${b.title}`, desc:`${b.year} · 역사 속 전투에 나서요`, btn:'출정'}; }
  if(t.type==='diplo'){ const d=DIPLO[t.did]; return {ic:'🤝', title:`외교 의뢰: ${d.title}`, desc:`${d.year} · ${d.dir==='send'?d.nation+'에 사절단을 보내요':d.nation+'의 사절단을 맞이해요'}`, btn:d.dir==='send'?'보내기':'맞이하기'}; }
  if(t.type==='build') return {ic:'🔨', title:`건설 의뢰: ${B[t.bid].name}`, desc:`${B[t.bid].name}을(를) 1채 지어 주세요`, btn:'지으러 가기'};
  return {ic:'⛏️', title:'유물 발굴 의뢰', desc:'땅속 유물을 찾아 분류해요', btn:'발굴하기'};
}
function viewTasks(){
  const list = S.tasks.length ? S.tasks.map(t=>{ const i=taskInfo(t);
    return `<div class="task"><div class="ti">${i.ic}</div><div><b>${i.title}</b><span>${i.desc}<br>${t.reward?'보상 '+rewardText(t.reward):'보상은 결과에 따라 달라져요'}</span></div><div class="tbtns"><button class="go" onclick="doTask(${t.id})">${i.btn}</button>${['war','diplo','maint'].includes(t.type)?`<button class="x" onclick="dismissTask(${t.id})">✖ 거절</button>`:''}</div></div>`; }).join('')
    : `<div class="empty">지금은 할 일이 없어요.<br>잠시 기다리면 새 할 일이 도착해요!</div>`;
  return `<h2 class="h2">할 일</h2><p class="sub">할 일은 계속 도착해요. 질문에 답하면 국력과 자원을 얻어요.</p>${list}`;
}
function doTask(id){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  if(t.type==='quiz'||t.type==='scene'){
    const i=taskInfo(t);
    askQ(t.qid,{head:`${i.ic} ${i.title}`, reward:t.reward, skip:true, cb:()=>{ S.tasks=S.tasks.filter(x=>x.id!==id); closeModal(); }});
  } else if(t.type==='build'){ S.sel=t.bid; S.curMap=S.stage; setTab('build'); toast(`${B[t.bid].name}을(를) 지어 보세요`); }
  else if(t.type==='maint'){ S.tasks=S.tasks.filter(x=>x.id!==id); runMaint(t.bid,()=>closeModal(),false,t.vi); }
  else if(t.type==='war'){ runBattle(t.bid,(res)=>{ if(res!=='retreat') S.tasks=S.tasks.filter(x=>x.id!==id); S.lastWar=t.bid; closeModal(); }); }
  else if(t.type==='diplo'){ S.tasks=S.tasks.filter(x=>x.id!==id); runDiplo(t.did,()=>closeModal()); }
  else { S.tasks=S.tasks.filter(x=>x.id!==id); startDig(t.reward); }
}

/* ===== 유물 발굴 (뜨거움·차가움 방식) ===== */
const DIGZ = [[7,7,4,1,18],[8,8,5,1,22],[9,9,6,2,28],[9,9,6,3,30]];
function viewDig(){
  const z=DIGZ[S.stage];
  return `<h2 class="h2">유물 발굴</h2>
  <p class="sub">삽으로 땅을 파면 가장 가까운 유물까지의 거리가 ‘뜨거움·차가움’으로 나타나요. 삽 횟수가 정해져 있어요!</p>
  <div class="stat"><div><b>${z[0]}×${z[1]}</b><small>발굴 지도</small></div><div><b>${z[2]+z[3]}개</b><small>숨은 유물</small></div><div><b>${z[4]}번</b><small>삽 횟수</small></div></div>
  <div class="lgd"><span style="background:#E2553C;color:#fff">뜨거움: 바로 옆 칸</span><span style="background:#F2A93B;color:#3a2400">따뜻: 2칸</span><span style="background:#8EC3E6;color:#0d2b3b">차가움: 3~4칸</span><span style="background:#2F5F9E;color:#fff">꽁꽁: 5칸 이상</span></div>
  <div class="learn"><b>가짜 유물도 섞여 있어요!</b><p>유물을 찾으면 삽 1번을 돌려받아요. 찾은 유물은 무엇을 알려주는 증거인지 분류해요. 맞히면 국력 +3, 기와 +2를 얻어요.</p></div>
  <div class="row"><button class="btn" onclick="startDig(null,true)" ${S.f<10?'disabled':''}>발굴 시작 (🌾 10)</button></div>
  <p class="sub" style="margin-top:10px">‘할 일’에 오는 유물 발굴 의뢰는 식량이 들지 않아요.</p>`;
}
function startDig(bonus, pay){
  if(pay){ if(S.f<10){ toast('식량이 부족해요'); return; } S.f-=10; }
  const [w,h,nr,nf,sh]=DIGZ[S.stage];
  const items = shuffle(ARTS).slice(0,nr).concat(shuffle(FAKES).slice(0,nf)).map(a=>({a,found:false,idx:-1}));
  const cells = shuffle([...Array(w*h).keys()]).slice(0,items.length);
  const itemAt={}; items.forEach((it,k)=>{ it.idx=cells[k]; itemAt[cells[k]]=it; });
  DG={w,h,items,itemAt,cell:Array(w*h).fill(0).map(()=>({rv:false})),shovels:sh,pending:null,fb:null,gained:0,bonus:bonus||null,ended:false};
  renderDig();
}
function levelOf(i){
  const D=DG, r=Math.floor(i/D.w), c=i%D.w; let d=99;
  D.items.forEach(it=>{ if(!it.found){ const rr=Math.floor(it.idx/D.w), cc=it.idx%D.w; d=Math.min(d,Math.max(Math.abs(rr-r),Math.abs(cc-c))); } });
  return d<=1?'hot':d===2?'warm':d<=4?'cool':'ice';
}
const LVTXT={hot:'뜨거움',warm:'따뜻',cool:'차가움',ice:'꽁꽁'};
function artImg(a){ return (a.key&&IMG[a.key]) ? `<img class="pic" src="${IMG[a.key]}" alt="">` : null; }
function renderDig(){
  const D=DG;
  if(D.ended){
    const got=D.items.filter(x=>x.found);
    openModal(`<h3>발굴 보고서</h3><p>유물 ${got.length}개를 찾았어요. 분류로 얻은 국력 <b>+${D.gained}</b></p>
    <ul class="found-list">${got.map(x=>`<li><span style="font-size:26px">${x.a.icon}</span><div><b>${x.a.name}</b> → ${catLabels(x.a)}</div></li>`).join('')||'<li>찾은 유물이 없어요.</li>'}</ul>
    ${got.length<D.items.length?'<p style="color:var(--muted)">못 찾은 유물은 다음 발굴에서 다시 만날 수 있어요.</p>':''}
    <div class="row"><button class="btn" onclick="closeModal()">발굴 마치기</button></div>`);
    return;
  }
  const found=D.items.filter(x=>x.found).length, total=D.items.length;
  let cells='';
  for(let i=0;i<D.w*D.h;i++){
    const c=D.cell[i], it=D.itemAt[i]; let cls='dc', inner='', dis='';
    if(c.rv){ cls+=' rv'; dis='disabled';
      if(it){ cls+=' it'; inner = artImg(it.a) || it.a.icon; }
      else { const lv=levelOf(i); cls+=' '+lv; inner=LVTXT[lv]; }
    } else if(D.pending||D.fb) dis='disabled';
    cells+=`<button class="${cls}" ${dis} onclick="digAt(${i})" aria-label="${i+1}번 칸">${inner}</button>`;
  }
  let h=`<h3>유물 발굴 현장</h3>
  <div class="dig-top"><span>숨은 유물 <b>${total}개</b> 중 <b>${found}개</b> 발견</span><span>⛏️ 남은 삽 <b>${D.shovels}</b>번</span></div>
  <div class="dgrid" style="--w:${D.w}">${cells}</div>`;
  if(D.pending){
    const a=D.pending.a;
    h+=`<div class="learn"><div style="text-align:center">${artImg(a)||`<div class="bigemo">${a.icon}</div>`}<b>${a.name}</b>을(를) 찾았어요!<br>${a.look}</div></div>
    <p><b>이 유물은 무엇을 알려주는 증거일까요?</b></p>
    <div class="catg">${['go','bu','tang','royal','fake'].map(k=>`<button class="opt" onclick="classify('${k}')">${CATS[k].icon} ${CATS[k].label}</button>`).join('')}</div>`;
  } else if(D.fb){
    const a=D.fb.item.a, n=a.note?NOTES[a.note]:null;
    h+=`<div class="${D.fb.ok?'good':'bad'}"><b>${D.fb.ok?'정답! ⭐+3 🧱+2'+(a.alt?'<br>👀 이 유물은 두 가지로 분류할 수 있어요: '+catLabels(a):''):'아쉬워요. 정답은 「'+catLabels(a)+'」'}</b><br>${a.name}: ${a.why}</div>
    ${D.fb.nw&&n?`<div class="learn"><b>📖 노트가 열렸어요: ${n.icon} ${n.title}</b></div>`:''}
    <div class="row"><button class="btn" onclick="nextDig()">계속 파기</button></div>`;
  } else {
    h+=`<p class="sub">칸을 눌러 파요. 색깔을 보고 유물이 어디쯤 있을지 추리해 보세요.</p>
    <div class="row"><button class="btn alt" onclick="finishDig()">그만 파기</button></div>`;
  }
  openModal(h);
  if(D.pending||D.fb) $('sheet').scrollTop=$('sheet').scrollHeight;
}
function digAt(i){
  const D=DG; if(!D||D.pending||D.fb||D.shovels<1) return; const c=D.cell[i]; if(c.rv) return;
  D.shovels--; c.rv=true; sfx('dig');
  const it=D.itemAt[i];
  if(it){ it.found=true; D.pending=it; D.shovels++; setTimeout(()=>sfx('found'),120); renderDig(); return; }
  const lv=levelOf(i); setTimeout(()=>sfx(lv),90);
  if(D.shovels<1){ finishDig(); return; }
  renderDig();
}
function catLabels(a){ return [a.cat].concat(a.alt||[]).map(c=>CATS[c].label).join(' · '); }
function classify(cat){
  const D=DG, it=D.pending; if(!it) return;
  const ok = cat===it.a.cat || (it.a.alt||[]).includes(cat); D.pending=null; S.st.dig++;
  let nw=false;
  if(ok){ S.power+=3; S.t+=2; D.gained+=3; S.st.digOk++; sfx('good'); } else sfx('bad');
  if(it.a.note) nw=learn(it.a.note);
  D.fb={ok,item:it,nw};
  save(); renderHdr(); renderDig();
}
function nextDig(){
  const D=DG; D.fb=null;
  if(D.items.every(x=>x.found)){
    S.power+=5; D.gained+=5; if(D.bonus) giveReward(D.bonus);
    D.ended=true; sfx('fanfare');
    openModal(`<h3>유물을 모두 찾았어요!</h3><div class="good"><b>보너스 ⭐+5${D.bonus?' · '+rewardText(D.bonus):''}</b></div>
    <ul class="found-list">${D.items.map(x=>`<li><span style="font-size:26px">${x.a.icon}</span><div><b>${x.a.name}</b> → ${catLabels(x.a)}</div></li>`).join('')}</ul>
    <div class="row"><button class="btn" onclick="closeModal()">발굴 마치기</button></div>`);
    return;
  }
  if(D.shovels<1){ finishDig(); return; }
  renderDig();
}
function finishDig(){ DG.ended=true; DG.pending=null; DG.fb=null; addLogSafe(); renderDig(); }
function addLogSafe(){}

/* ===== 승급 기준 / 시험 ===== */
function reqs(){
  const s=S.stage; if(s>=3) return null;
  const it=[];
  it.push({l:'⭐ 국력',cur:Math.floor(S.power),need:[30,80,150][s]});
  it.push({l:'👥 백성',cur:S.people,need:[10,22,35][s]});

function nextExamQ(){

  const B={sc,t:0,speed:((typeof S!=='undefined'&&S&&S.btSpeed)||1),mil,dip,mulA,mulE,mon:(sc.mon||150)+ef.mon+(opts.mon||0),monMax:900,mps:(sc.mps||24)+ef.mps+(opts.mps||0),
    units:[],arrows:[],puffs:[],aMax:sc.aHp*mulA+(opts.allyHp||0),eMax:sc.eHp,cd:{inf:0,arc:0,cav:0,hero:0},cannon:0,cannonMax:26,
    fate:false,fateAt:0,over:false,win:null,spawnT:2,heroDone:false,capI:0,cap:'',capLeft:0,reinfA:0,reinfT:0,surge:0,
    supN:ef.sup,supDone:0,hitT:0,killed:0,lost:0,spawned:0,flash:0};
  B.aHp=B.aMax; B.eHp=B.eMax;
  B.cap=`⚔️ 군사력 보너스 +${ef.up}% · 🤝 외교력으로 적 −${ef.nerf}%`; B.capLeft=3.5;
  B.snowP=Array.from({length:60},()=>({x:Math.random()*FX,y:Math.random(),s:20+Math.random()*30}));
  return B;
}
function btSpawn(B,side,type){
  const t=UT[type], m = side==='a' ? B.mulA : B.mulE*((B.fate&&!B.sc.histWin)?1.25:1);
  B.units.push({side,type,x:side==='a'?BA+22:BE-22,hp:t.hp*m,max:t.hp*m,atk:t.atk*m,rng:t.rng,spd:t.spd,iv:t.iv,cdA:0.3,fl:0,dead:false,flee:false});
}
function btCap(B,x,s){ B.cap=x; B.capLeft=s; }
function btDmgBase(B,side,amt){
  if(side==='a') B.aHp=Math.max(0,B.aHp-amt); else B.eHp=Math.max(0,B.eHp-amt);
}
function btHitSfx(B){ if(B.t-B.hitT>0.14){ B.hitT=B.t; sfx('hit'); } }
function btFate(B){
  B.fate=true; B.fateAt=B.t; btCap(B,B.sc.fateCap,9); sfx('war');
  if(B.sc.histWin){ B.reinfA=4; B.units.forEach(u=>{ if(u.side==='e') u.atk*=0.75; }); }
  else { B.surge=12; }
}
function btEnd(B,win){ B.over=true; B.win=win; LASTBT={time:B.t,win,killed:B.killed,lost:B.lost}; }
function btBuy(B,type){
  const u=UT[type]; if(B.over||B.mon<u.cost||B.cd[type]>0) return false;
  B.mon-=u.cost; B.cd[type]=u.cd; btSpawn(B,'a',type); B.spawned++; sfx('spawn'); return true;
}
function btCannon(B){
  if(B.over||B.cannon<B.cannonMax) return false;
  B.cannon=0; B.flash=0.35; sfx('war');
  B.units.forEach(u=>{ if(u.side==='e'&&!u.dead){ u.hp-=100*B.mulA; u.fl=.2; if(u.hp<=0){ u.dead=true; B.killed++; B.puffs.push({x:u.x,t:.4}); } } });
  btDmgBase(B,'e',60*B.mulA); return true;
}
function btUpdate(B,dt){
  if(B.over) return;
  B.t+=dt; const sc=B.sc;
  B.mon=Math.min(B.monMax,B.mon+B.mps*dt);
  for(const k in B.cd) B.cd[k]=Math.max(0,B.cd[k]-dt);
  B.cannon=Math.min(B.cannonMax,B.cannon+dt);
  B.flash=Math.max(0,B.flash-dt);
  while(B.capI<sc.caps.length && B.t>=sc.caps[B.capI].t && B.t>4){ btCap(B,sc.caps[B.capI].x,5); B.capI++; }
  if(B.capLeft>0) B.capLeft-=dt;
  if(!B.fate && B.t>=sc.fateT) btFate(B);
  if(B.supN>0 && B.supDone<2 && B.t>=[22,48][B.supDone]){
    B.supDone++; for(let i=0;i<B.supN;i++) btSpawn(B,'a',i%2?'arc':'inf');
    btCap(B,'🤝 외교의 힘! 이웃 나라의 지원군이 도착했어요!',5); sfx('good');
  }
  B.spawnT-=dt;
  if(B.spawnT<=0){
    const normal = Math.max(1.4, sc.gap - B.t*0.022);
    if(B.surge>0){ B.surge--; B.spawnT=0.9; btSpawn(B,'e',Math.random()<0.65?'cav':'inf'); }
    else {
      B.spawnT = (B.fate&&sc.histWin) ? normal*1.6 : normal;
      const w=sc.weights, r=Math.random(); const type = r<w.inf?'inf':(r<w.inf+w.arc?'arc':'cav');
      btSpawn(B,'e',type);
    }
  }
  if(!B.heroDone && B.t>=sc.heroAt){ B.heroDone=true; btSpawn(B,'e','hero'); btCap(B,`⚠️ 적의 장수 ${sc.eHero} 등장!`,4); }
  if(B.reinfA>0){ B.reinfT-=dt; if(B.reinfT<=0){ B.reinfT=0.35; B.reinfA--; btSpawn(B,'a','cav'); } }
  const slow = sc.snow ? Math.max(0.2, 1 - B.t/(sc.fateT*0.9)) : 1;
  for(const u of B.units){
    if(u.dead) continue;
    u.fl=Math.max(0,u.fl-dt);
    const dir=u.side==='a'?1:-1;
    let tgt=null,best=1e9;
    for(const v of B.units){ if(v.dead||v.side===u.side) continue; const d=(v.x-u.x)*dir; if(d>-8&&d<=u.rng&&d<best){ best=d; tgt=v; } }
    const bx=u.side==='a'?BE:BA, db=(bx-u.x)*dir;
    const hitBase = !tgt && db<=u.rng+22;
    if(tgt||hitBase){
      u.cdA-=dt;
      if(u.cdA<=0){
        u.cdA=u.iv;
        if(tgt){
          tgt.hp-=u.atk; tgt.fl=0.12;
          if(u.rng>60) B.arrows.push({x1:u.x,x2:tgt.x,t:0.18});
          if(tgt.hp<=0){ tgt.dead=true; B.puffs.push({x:tgt.x,t:0.4}); if(tgt.side==='e') B.killed++; else B.lost++; }
        } else btDmgBase(B, u.side==='a'?'e':'a', u.atk);
        btHitSfx(B);
      }
    } else u.x += dir*(u.side==='e'?u.spd*slow:u.spd)*dt;
  }
  B.units=B.units.filter(u=>!u.dead);
  B.arrows.forEach(a=>a.t-=dt); B.arrows=B.arrows.filter(a=>a.t>0);
  B.puffs.forEach(p=>p.t-=dt); B.puffs=B.puffs.filter(p=>p.t>0);
  if(B.eHp<=0) btEnd(B,true); else if(B.aHp<=0) btEnd(B,false);
  if(!B.over && B.t>sc.fateT+70) btEnd(B, B.eHp/B.eMax < B.aHp/B.aMax);
}

function drawBase(ctx,x,gy,col){
  ctx.fillStyle='#777'; ctx.fillRect(x-26,gy-70,52,70);
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x-34,gy-70); ctx.lineTo(x,gy-100); ctx.lineTo(x+34,gy-70); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#4a3a2a'; ctx.fillRect(x-8,gy-30,16,30);
  ctx.fillStyle=col; ctx.fillRect(x-2,gy-130,4,32); ctx.fillRect(x+2,gy-130,22,12);
}
function hpBar(ctx,x,y,w,r,col){
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(x,y,w,12);
  ctx.fillStyle=col; ctx.fillRect(x+1,y+1,Math.max(0,(w-2)*Math.max(0,Math.min(1,r))),10);
}
function btDraw(B){
  const cv=B.cv, ctx=B.ctx; if(!ctx) return;
  const W=cv.width, H=cv.height, sx=W/FX, h=H/sx, sc=B.sc;
  ctx.setTransform(sx,0,0,sx,0,0);
  const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,sc.bg[0]); g.addColorStop(1,sc.bg[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,FX,h);
  const gy=h*0.8;
  ctx.fillStyle='rgba(0,0,0,.16)';
  if(sc.terrain==='mount'||sc.terrain==='snow'){ for(let i=0;i<6;i++){ const bx=i*170-30; ctx.beginPath(); ctx.moveTo(bx,gy); ctx.lineTo(bx+90,gy-70-(i%3)*18); ctx.lineTo(bx+180,gy); ctx.closePath(); ctx.fill(); } }
  if(sc.terrain==='castle'){ for(let i=0;i<8;i++) ctx.fillRect(i*110+10,gy-56,70,56); }
  if(sc.terrain==='forest'){ ctx.fillStyle='rgba(0,40,0,.28)'; for(let i=0;i<14;i++){ const tx=i*62+10; ctx.beginPath(); ctx.moveTo(tx,gy); ctx.lineTo(tx+28,gy-80-(i%3)*14); ctx.lineTo(tx+56,gy); ctx.closePath(); ctx.fill(); } }
  if(sc.terrain==='sea'){ ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=2; for(let i=0;i<12;i++){ const wx=(i*80+B.t*20)%FX, wy=gy+8+(i%3)*10; ctx.beginPath(); ctx.moveTo(wx,wy); ctx.quadraticCurveTo(wx+20,wy-6,wx+40,wy); ctx.stroke(); } }
  ctx.fillStyle=sc.ground; ctx.fillRect(0,gy,FX,h-gy);
  drawBase(ctx,BA,gy,'#2F6F6B'); drawBase(ctx,BE,gy,'#C23B3B');
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const u of B.units){
    const big=u.type==='hero', r=big?22:16, y=gy-r-2;
    ctx.fillStyle = u.fl>0 ? '#ffffff' : (u.side==='a'?'#2F6F6B':'#C23B3B');
    ctx.beginPath(); ctx.arc(u.x,y,r,0,Math.PI*2); ctx.fill();
    ctx.font=(big?34:24)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText(sc.emo[u.side][u.type],u.x,y+1);
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(u.x-16,y-r-8,32,5);
    ctx.fillStyle=u.side==='a'?'#4FD1B5':'#FF7B6B'; ctx.fillRect(u.x-16,y-r-8,32*Math.max(0,u.hp/u.max),5);
  }
  ctx.strokeStyle='#ffe9a8'; ctx.lineWidth=2;
  B.arrows.forEach(a=>{ ctx.beginPath(); ctx.moveTo(a.x1,gy-26); ctx.lineTo(a.x2,gy-30); ctx.stroke(); });
  ctx.font='22px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  B.puffs.forEach(p=>ctx.fillText('💨',p.x,gy-20));
  if(sc.snow){ ctx.fillStyle='rgba(255,255,255,.85)'; B.snowP.forEach(p=>{ const px=(p.x+B.t*15)%FX, py=((p.y*h)+B.t*p.s)%h; ctx.beginPath(); ctx.arc(px,py,2.2,0,6.3); ctx.fill(); }); }
  hpBar(ctx,14,8,170,B.aHp/B.aMax,'#4FD1B5'); hpBar(ctx,FX-184,8,170,B.eHp/B.eMax,'#FF7B6B');
  ctx.font='bold 14px sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.fillText(sc.baseA,16,32); ctx.textAlign='right'; ctx.fillText(sc.baseE,FX-16,32);
  if(B.flash>0){ ctx.fillStyle=`rgba(255,240,200,${B.flash})`; ctx.fillRect(0,0,FX,h); }
}

function btFrame(ts){

/* ===== 군사력·외교력·문화력 (국력 = 군사력 + 외교력 + 문화력) ===== */
function addStat(kind,n){ if(!n) return; const d=Math.max(-(S[kind]||0),n); S[kind]=(S[kind]||0)+d; S.power=Math.max(0,S.power+d); }

/* ===== 국고(💰)와 민심(💗) ===== */
function prodMul(){ return S.morale<30?0.75:(S.morale>=80?1.15:1); }
function clampMood(){ S.morale=Math.max(0,Math.min(100,S.morale)); }
function canPay(c){ c=c||{}; return S.f>=(c.f||0) && S.t>=(c.t||0) && S.gold>=(c.g||0); }
function payCost(c){ c=c||{}; S.f-=c.f||0; S.t-=c.t||0; S.gold-=c.g||0; }
function effText(e){
  const a=[], sg=n=>(n>0?'+':'')+n;
  if(e.g) a.push('💰'+sg(e.g)); if(e.m) a.push('💗'+sg(e.m)); if(e.f) a.push('🌾'+sg(e.f)); if(e.t) a.push('🧱'+sg(e.t));
  if(e.people) a.push('👥'+sg(e.people)); if(e.mil) a.push('⚔️'+sg(e.mil)); if(e.dip) a.push('🤝'+sg(e.dip)); if(e.p) a.push('⭐'+sg(e.p));
  return a.join(' ');
}
function applyEff(e){
  if(e.g) S.gold=Math.max(0,S.gold+e.g);
  if(e.m){ S.morale+=e.m; clampMood(); }
  if(e.f) S.f=Math.max(0,S.f+e.f);
  if(e.t) S.t=Math.max(0,S.t+e.t);
  if(e.people) S.people=Math.max(1,S.people+e.people);
  if(e.mil) addStat('mil',e.mil);
  if(e.dip) addStat('dip',e.dip);
  if(e.p) S.power=Math.max((S.mil||0)+(S.dip||0), S.power+e.p);
}
function moodLabel(){ const m=S.morale; return m>=80?'매우 좋음':(m>=60?'좋음':(m>=40?'보통':(m>=30?'불안':'위험'))); }
function econPanel(){
  const r=rates(), net=r.g*(r.g>0?prodMul():1);
  return `<h2 class="h2" style="margin-top:14px">나라 살림</h2>
  <div class="stat"><div><b>💰 ${Math.floor(S.gold)}</b><small>국고 (${net>=0?'+':''}${fmt(net)}/4초)</small></div><div><b>💗 ${Math.floor(S.morale)}</b><small>민심 ${moodLabel()}</small></div><div><b>×${prodMul()}</b><small>생산 보정</small></div></div>
  <div class="learn"><p>수입은 시장·밭·집에서, 지출은 병영·산성·사신관의 유지비예요. 국고가 0이 되면 민심이 떨어져요. 민심이 30 미만이면 생산이 25% 줄고, 80 이상이면 15% 늘어요.</p></div>`;
}

function chron(t){ if(!S.chron) S.chron=[]; S.chron.push(t); if(S.chron.length>60) S.chron.shift(); }
function cultureOf(){ return Math.max(0, S.power-(S.mil||0)-(S.dip||0)); }
function statPanel(){

function mgStackDrop(){
  const M=MG; if(!M||M.kind!=='stack'||M.over) return;

  let x=c.x, w=c.w;

  const L=Math.max(x,top.x), R=Math.min(x+w,top.x+top.w), ov=R-L;

  const built=M.layers.length-1;

  mgStackDraw();
}

function lifePool(){

}
function histSub(e){ return e.battle?'battle':(e.diplo?'diplo':'story'); }
function nextHist(){
  const l=EVENTS.filter(e=>e.stage<=S.stage && !S.evSeen[e.id]); if(!l.length) return null;

}
function triggerEvent(){
  const h=nextHist(); lifePool();

  const dis=grab('dis'), life=grab('life');
  const kinds=[]; if(h) kinds.push('hist','hist'); if(dis.length) kinds.push('dis','dis'); if(life.length) kinds.push('life','life');
  if(!kinds.length) return false;
  const pool=kinds.filter(k=>k!==S.lastKind), use=pool.length?pool:kinds, k=pick(use);
  S.lastKind=k; S.evCount=(S.evCount||0)+1;

const AUD={ctx:null,mus:null,fx:null,bgm:true,sfx:true,mood:'calm',beat:0,next:0,idx:3,timer:null};
try{ const c=JSON.parse(localStorage.getItem('balhae-audio')||'null'); if(c){ AUD.bgm=c.bgm!==false; AUD.sfx=c.sfx!==false; } }catch(e){}
function saveAud(){ try{ localStorage.setItem('balhae-audio',JSON.stringify({bgm:AUD.bgm,sfx:AUD.sfx})); }catch(e){} }
const MOOD={
  calm:{bpm:68, sc:[293.66,329.63,369.99,440,493.88,587.33,659.25], drone:[73.42,110], drum:1, vol:.17},
  war:{bpm:108, sc:[293.66,349.23,392,440,523.25,587.33], drone:[73.42,98], drum:3, vol:.18},
  sad:{bpm:54, sc:[220,246.94,293.66,329.63,392,440], drone:[55,82.41], drum:0, vol:.16}
};
function setMood(m){ AUD.mood=m; AUD.beat=0; }
const SILENT_WAV='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAIARKwAABCxAgAEABAAZGF0YQQAAAAAAAAA';
function iosSilentFix(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  try{
    if(!AUD.el){ const a=new Audio(SILENT_WAV); a.loop=true; a.volume=0.01; a.setAttribute('playsinline',''); AUD.el=a; }
    const pr=AUD.el.play(); if(pr&&pr.catch) pr.catch(()=>{});
  }catch(e){}
}
function audioInit(){
  iosSilentFix();

  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const c=new C(); AUD.ctx=c;
    AUD.mus=c.createGain(); AUD.mus.gain.value=AUD.bgm?0.55:0; AUD.mus.connect(c.destination);
    AUD.fx=c.createGain(); AUD.fx.gain.value=AUD.sfx?0.85:0; AUD.fx.connect(c.destination);
    try{ const b=c.createBuffer(1,1,22050), src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(0); }catch(e){}
    try{ c.resume(); }catch(e){}

    AUD.timer=setInterval(musicTick,150);
  }catch(e){}
}
function audioState(){ return AUD.ctx && AUD.ctx.state==='running' ? '재생 준비 완료' : '대기 중 (화면을 한 번 눌러 주세요)'; }
function soundTest(){ audioInit(); setTimeout(()=>{ sfx('fanfare'); showMenu(); },250); }
function applyAud(){ if(!AUD.ctx) return; AUD.mus.gain.value=AUD.bgm?0.55:0; AUD.fx.gain.value=AUD.sfx?0.85:0; }
function toggleSound(){ const on = !(AUD.bgm||AUD.sfx); AUD.bgm=on; AUD.sfx=on; saveAud(); applyAud(); audioInit(); updSnd(); toast(on?'소리를 켰어요':'소리를 껐어요'); }
function toggleBgm(){ AUD.bgm=!AUD.bgm; saveAud(); applyAud(); updSnd(); showMenu(); }
function toggleSfx(){ AUD.sfx=!AUD.sfx; saveAud(); applyAud(); updSnd(); showMenu(); }
function updSnd(){ const b=$('snd'); if(b) b.textContent=(AUD.bgm||AUD.sfx)?'🔊':'🔇'; }
function noiseBuf(c){ if(AUD._nb) return AUD._nb; const b=c.createBuffer(1,c.sampleRate*0.3,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AUD._nb=b; return b; }
function pluck(f,t,v,dur,dest){
  const c=AUD.ctx, o=c.createOscillator(), g=c.createGain(), fl=c.createBiquadFilter();
  o.type='triangle'; o.frequency.value=f; fl.type='lowpass'; fl.frequency.value=2400;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.012); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(fl); fl.connect(g); g.connect(dest||AUD.mus); o.start(t); o.stop(t+dur+0.05);
  const o2=c.createOscillator(), g2=c.createGain(); o2.type='sine'; o2.frequency.value=f*2;
  g2.gain.setValueAtTime(0.0001,t); g2.gain.exponentialRampToValueAtTime(v*0.25,t+0.01); g2.gain.exponentialRampToValueAtTime(0.0008,t+dur*0.6);
  o2.connect(g2); g2.connect(dest||AUD.mus); o2.start(t); o2.stop(t+dur);

function thump(t,v,dest){
  const c=AUD.ctx, o=c.createOscillator(), g=c.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(48,t+0.18);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
  o.connect(g); g.connect(dest||AUD.mus); o.start(t); o.stop(t+0.25);

function hiss(t,v,dest){

function musicTick(){

  while(AUD.next < c.currentTime+0.6){
    const t=AUD.next, b=AUD.beat++;
    if(b%8===0) droneNote(t,m,8);

function tone(f,t,d,type,v,slide){

setInterval(()=>{
  if(!S || modalOpen) return;
  S.tickT++; S.spawnT++; S.evT=(S.evT||0)+1; S.play=(S.play||0)+1;
  let big=false;
  if(S.tickT>=4){
    S.tickT=0; const r=rates(), mul=prodMul();
    S.f+=r.f*mul; S.t+=r.t*mul; S.power+=(r.p+r.mil+r.dip)*mul; S.mil+=r.mil*mul; S.dip+=r.dip*mul;
    S.gold+= r.g>0 ? r.g*mul : r.g;
    if(S.gold<=0){ S.gold=0; if(r.g<0){ S.morale-=1.2; if(!S.bankT||S.play-S.bankT>60){ S.bankT=S.play; toast('💰 국고가 바닥났어요! 민심이 떨어져요'); } } }
    S.morale+=(55-S.morale)*0.03; clampMood();
    big=true; save();
  }
  if(checkPromo()) return;
  const evNeed = (S.evCount||0)===0 ? 30 : 60;
  if(S.evT>=evNeed){ S.evT=0; if(triggerEvent()) return; }
  const need = S.tasks.length<2 ? 3 : 9;
  if(S.spawnT>=need && S.tasks.length<6){
    S.spawnT=0;
    if(spawnTask()){ big=true; sfx('task'); if(S.tab!=='tasks') toast('📋 새 할 일이 도착했어요!'); }
  }
  if(tickBuild()) big=true;
  renderHdr();
  if(big){ renderTabs(); if(S.tab==='build'||S.tab==='tasks'||S.tab==='goal') renderView(); }
},1000);

(function boot(){
  updSnd();
  const saved=load();
  if(saved){ S=saved; render(); toast('이어서 시작해요'); }
  else { S=newState(); seedTasks(); render(); showIntro(); }
})();
</script>
</body>
</html>
